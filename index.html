    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://leemark.github.io/ezcrop/" />

    <meta property="og:description" content="Crop, resize, and download images in WebP, JPEG, or AVIF. All processing happens in your browser." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="EZCrop — Free Online Image Crop &amp; Resize Tool" />
    <meta name="twitter:description" content="Crop, resize, and download images in WebP, JPEG, or AVIF. All processing happens in your browser." />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "EZCrop",
      "description": "Free online image crop and resize tool. Works entirely in your browser.",
      "url": "https://leemark.github.io/ezcrop/",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Web",
      "offers": { "@type": "Offer", "price": "0" }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      (function () {
        var stored = localStorage.getItem('ezcrop-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
